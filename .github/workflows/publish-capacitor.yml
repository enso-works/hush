name: publish capacitor

# Publishes @bavrk/hush-capacitor to npm when a tag capacitor-v<version> is pushed, e.g.
#   (bump capacitor/package.json, commit)
#   git tag capacitor-v0.1.1 && git push origin capacitor-v0.1.1
# The tag must match capacitor/package.json. Uses the NPM_TOKEN secret, as the SDK does.

on:
  push:
    tags: ['capacitor-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: test "capacitor-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
