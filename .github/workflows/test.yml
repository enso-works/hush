name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # useConfig() under real React and the React Compiler, as the apps build it.
      - run: npm test
      - run: npm run build
      # What `npm install @bavrk/hush` gets: both builds load, no .ts paths in the types.
      - name: The package loads as ESM and CommonJS
        run: |
          node --input-type=module -e "import { createHush, SDK_VERSION } from './dist/esm/core.js'; if (typeof createHush !== 'function') process.exit(1); console.log('esm', SDK_VERSION)"
          node -e "const c = require('./dist/cjs/core.js'); if (typeof c.createHush !== 'function') process.exit(1); console.log('cjs ok')"
          if grep -n "core\.ts" dist/esm/*.d.ts; then echo "types point at .ts files"; exit 1; fi
          npm pack --dry-run

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      # src/dashboard/ is committed so running hush needs no build step; it
      # must be exactly what the source builds to.
      - name: The committed build matches its source
        run: |
          git status --porcelain src/dashboard
          test -z "$(git status --porcelain src/dashboard)"

  # The dashboard in a real browser against a DEMO server: every page and
  # panel, every switch, no console errors, no failed /admin request.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run e2e
        working-directory: dashboard

  # @bavrk/hush-expo's JavaScript typechecks and builds (its Swift is built by
  # the apps that use it; its tests run with the server's, test/expo.test.mjs).
  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --dry-run

  # @bavrk/hush-capacitor's JavaScript typechecks and builds (its Swift is built
  # by the apps that use it; its tests run with the server's,
  # test/capacitor.test.mjs).
  capacitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --dry-run

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hush .
