name: publish godot

# Releases the Godot add-on when a merge to main changes its version: bump
# version in godot/addons/hush/plugin.cfg and SDK_VERSION in hush.gd together
# (this checks both), and the version in its README and the docs, in the pull
# request. A merge that leaves the version as it is releases nothing. The
# release, tagged godot-v<version>, carries hush-godot-<version>.zip, which
# holds addons/hush/ and nothing else, to unzip into a project's root. With
# the repository variable HUSH_GODOT_MIRROR set to `on` and a deploy key in
# the secret HUSH_GODOT_MIRROR_KEY, addons/hush/ also goes to
# enso-works/hush-godot, the repository the Godot Asset Library reads; until
# then that step is skipped. Run it by hand (Actions, Run workflow) to retry a
# failed release.

on:
  push:
    branches: [main]
    paths: ['godot/addons/hush/**', '.github/workflows/publish-godot.yml']
  workflow_dispatch:

concurrency:
  group: publish-godot
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: plugin.cfg and SDK_VERSION agree, and is this version tagged yet
        id: version
        run: |
          version=$(sed -nE 's/^version="(.*)"$/\1/p' godot/addons/hush/plugin.cfg)
          sdk=$(sed -nE 's/^const SDK_VERSION := "(.*)"$/\1/p' godot/addons/hush/hush.gd)
          echo "plugin.cfg $version, SDK_VERSION $sdk"
          test -n "$version"
          test "$sdk" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/godot-v$version" > /dev/null; then
            echo "Godot add-on $version is tagged already: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Godot add-on $version is not tagged: releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          godot --version
      # --check-only exits 0 on a parse error, so the output decides.
      - name: Every script parses
        working-directory: godot
        run: |
          for f in addons/hush/*.gd tests/*.gd; do
            out=$(godot --headless --path . --check-only -s "$f" 2>&1)
            if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load' <<<"$out"; then echo "$out"; exit 1; fi
            echo "$f parses"
          done
      - name: The add-on against the real server
        run: node --test test/godot.test.mjs
        env:
          REQUIRE_GODOT: '1'
      - name: Zip addons/hush
        working-directory: godot
        run: |
          zip -r "../hush-godot-${{ needs.check.outputs.version }}.zip" addons/hush -x '*.tmp'
          unzip -l "../hush-godot-${{ needs.check.outputs.version }}.zip"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "godot-v$VERSION" "hush-godot-$VERSION.zip" --target "$GITHUB_SHA" --title "Godot add-on $VERSION" --notes "hush for Godot $VERSION. Unzip hush-godot-$VERSION.zip into your project's root (it holds addons/hush/), then enable the plugin in Project Settings > Plugins: see godot/addons/hush/README.md."
      - name: Mirror addons/hush to enso-works/hush-godot
        if: vars.HUSH_GODOT_MIRROR == 'on'
        env:
          DEPLOY_KEY: ${{ secrets.HUSH_GODOT_MIRROR_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::HUSH_GODOT_MIRROR is on but HUSH_GODOT_MIRROR_KEY is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/hush_godot_mirror
          chmod 600 ~/.ssh/hush_godot_mirror
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/hush_godot_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:enso-works/hush-godot.git mirror
          cd mirror
          git checkout -B main
          rm -rf addons/hush
          mkdir -p addons
          cp -R ../godot/addons/hush addons/hush
          # The Asset Library shows the repository's root README and LICENSE.
          cp addons/hush/README.md addons/hush/LICENSE .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "hush for Godot $VERSION" || echo "nothing changed"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
