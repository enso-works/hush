# hush and its Postgres. `docker compose up -d` from this directory, with a
# .env next to it (cp .env.example .env). Put a TLS-terminating proxy in
# front before pointing apps at it; see "Before pointing real apps at it" in
# the README. Every variable the README documents is passed through here,
# except PORT (the container listens on 3000; HUSH_PORT picks the host port)
# and DATABASE_URL, built below from POSTGRES_PASSWORD for the db service.
# CATALOG_FILE is a host path, mounted at /config/catalog.json. ADMIN_TOKEN
# goes by that name only, not TELEMETRY_ADMIN_TOKEN.
services:
  hush:
    build: ..
    # or, once published: image: ghcr.io/enso-works/hush:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hush:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/hush
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      ADMIN_PROXY_HEADER: ${ADMIN_PROXY_HEADER:-}
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET:-}
      APPS: ${APPS:-}
      CATALOG_FILE: ${CATALOG_FILE:+/config/catalog.json}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      COUNTRY_HEADER: ${COUNTRY_HEADER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      REPLY_HINT: ${REPLY_HINT:-}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-180}
      INSTALL_RETENTION_DAYS: ${INSTALL_RETENTION_DAYS:-}
      RC_API_KEY: ${RC_API_KEY:-}
      RC_PROJECTS: ${RC_PROJECTS:-}
      RC_CURRENCY: ${RC_CURRENCY:-USD}
      RC_STALE_MINUTES: ${RC_STALE_MINUTES:-10}
      RC_FLOOR_SECONDS: ${RC_FLOOR_SECONDS:-60}
      RC_RATE_PER_MINUTE: ${RC_RATE_PER_MINUTE:-20}
      ASC_KEY_ID: ${ASC_KEY_ID:-}
      ASC_ISSUER_ID: ${ASC_ISSUER_ID:-}
      ASC_PRIVATE_KEY: ${ASC_PRIVATE_KEY:-}
      # A path inside the container: mount the .p8 under volumes to use it.
      ASC_PRIVATE_KEY_FILE: ${ASC_PRIVATE_KEY_FILE:-}
      ASC_API_BASE: ${ASC_API_BASE:-https://api.appstoreconnect.apple.com}
      DEMO: ${DEMO:-}
    volumes:
      # Only used when CATALOG_FILE is set in .env.
      - ${CATALOG_FILE:-./catalog.example.json}:/config/catalog.json:ro
    ports:
      - "127.0.0.1:${HUSH_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hush
    volumes:
      - hush_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hush"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hush_db:
